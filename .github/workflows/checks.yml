name: SEPT checks

on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      release-version:
        description: Exact version selected from completed publications
        type: string
        default: ""

permissions:
  contents: read

jobs:
  verify:
    name: Linux ${{ matrix.arch }} package and image
    concurrency:
      group: sept-heavy
      queue: max
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.23.3
          package-manager-cache: false
      - name: Pin npm
        run: npm install --global npm@11.21.0
      - name: Stamp disposable checkout metadata
        env:
          RELEASE_VERSION: ${{ inputs.release-version }}
        run: node scripts/ci/version.mjs
      - name: Check, build, cold install and exercise the exact package and image
        env:
          SEPT_CI_OUTPUT: ${{ runner.temp }}/sept-evidence
          SEPT_ENGINE_SOCKET: /run/docker.sock
          SEPT_CI_ARCH: ${{ matrix.arch }}
        run: nice -n 10 node scripts/ci/verify.mjs
      - name: Retain verified artifacts and failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sept-verified-${{ matrix.arch }}-attempt${{ github.run_attempt }}
          path: ${{ runner.temp }}/sept-evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Retain cold consumer state
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sept-consumer-${{ matrix.arch }}-attempt${{ github.run_attempt }}
          path: /tmp/sept-ci-*/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
  macos:
    name: macOS ${{ matrix.arch }} installed package lifecycle
    needs: verify
    concurrency:
      group: sept-heavy
      queue: max
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.23.3
          package-manager-cache: false
      - run: npm install --global npm@11.21.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sept-verified-amd64-attempt*
          path: ${{ runner.temp }}/sept-artifacts
      - name: Cold install and exercise native macOS public package and CLI
        env:
          SEPT_CI_ARTIFACTS: ${{ runner.temp }}/sept-artifacts
          SEPT_CI_OUTPUT: ${{ runner.temp }}/sept-macos-evidence
          SEPT_CI_NODE_ARCH: ${{ matrix.arch }}
        run: nice -n 10 node scripts/ci/verify-macos.mjs
      - name: Retain macOS proof and failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sept-macos-${{ matrix.arch }}-attempt${{ github.run_attempt }}
          path: ${{ runner.temp }}/sept-macos-evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
  checks:
    name: All checks
    if: always()
    needs: [verify, macos]
    runs-on: ubuntu-24.04
    steps:
      - name: Require the full package and image gate
        env:
          LINUX: ${{ needs.verify.result }}
          MACOS: ${{ needs.macos.result }}
        run: test "$LINUX" = success && test "$MACOS" = success
