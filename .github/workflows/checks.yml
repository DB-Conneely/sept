name: SEPT checks

on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      release-version:
        description: Exact version selected from completed publications
        type: string
        default: ""

permissions:
  contents: read

jobs:
  verify:
    name: Linux amd64 package and image
    concurrency:
      group: sept-heavy
      queue: max
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.23.3
          package-manager-cache: false
      - name: Pin npm
        run: npm install --global npm@11.21.0
      - name: Stamp disposable checkout metadata
        env:
          RELEASE_VERSION: ${{ inputs.release-version }}
        run: node scripts/ci/version.mjs
      - name: Check, build, cold install and exercise the exact package and image
        env:
          SEPT_CI_OUTPUT: ${{ runner.temp }}/sept-evidence
          SEPT_ENGINE_SOCKET: /run/docker.sock
        run: nice -n 10 node scripts/ci/verify.mjs
      - name: Retain verified artifacts and failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sept-verified-amd64-attempt${{ github.run_attempt }}
          path: ${{ runner.temp }}/sept-evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Retain cold consumer state
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sept-consumer-attempt${{ github.run_attempt }}
          path: /tmp/sept-ci-*/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
  checks:
    name: All checks
    if: always()
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - name: Require the full package and image gate
        env:
          RESULT: ${{ needs.verify.result }}
        run: test "$RESULT" = success
